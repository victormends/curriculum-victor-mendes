name: Build LaTeX Résumés

on:
  push:
    branches: [main]
    paths:
      - "template.tex"
      - "template_ptbr.tex"
  pull_request:
    paths:
      - "template.tex"
      - "template_ptbr.tex"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install TeX Live (minimal + required packages)
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends \
            texlive-latex-base \
            texlive-latex-recommended \
            texlive-latex-extra \
            texlive-fonts-recommended \
            texlive-lang-portuguese

      - name: Compile EN résumé
        run: |
          pdflatex -interaction=nonstopmode -halt-on-error template.tex
          pdflatex -interaction=nonstopmode -halt-on-error template.tex

      - name: Rename EN output
        run: mv template.pdf Joao_Victor_Mendes_Resume.pdf

      - name: Compile PT-BR résumé
        run: |
          pdflatex -interaction=nonstopmode -halt-on-error template_ptbr.tex
          pdflatex -interaction=nonstopmode -halt-on-error template_ptbr.tex

      - name: Rename PT-BR output
        run: mv template_ptbr.pdf Joao_Victor_Mendes_Curriculo.pdf

      - name: Upload PDFs as artifacts
        uses: actions/upload-artifact@v4
        with:
          name: resumes
          path: |
            Joao_Victor_Mendes_Resume.pdf
            Joao_Victor_Mendes_Curriculo.pdf
          retention-days: 90

      - name: Commit compiled PDFs back to repo
        if: github.ref == 'refs/heads/main' && github.event_name == 'push'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add Joao_Victor_Mendes_Resume.pdf Joao_Victor_Mendes_Curriculo.pdf
          git diff --cached --quiet || git commit -m "ci: auto-compile résumés from LaTeX source [skip ci]"
          git push
